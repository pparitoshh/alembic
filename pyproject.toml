[project]
name = "distillkit"
version = "0.1.0"
description = "Tokenizer-independent sequence-level distillation: teacher Q&A -> small local student"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.19",
    "peft>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[project.scripts]
distillkit = "distillkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillkit"]

[dependency-groups]
dev = ["pytest>=8.0"]
