[project]
name = "distillkit"
version = "0.1.0"
description = "Tokenizer-independent sequence-level distillation: teacher Q&A -> small local student"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.19",
    "peft>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "mlflow-skinny>=3.0",   # report_to: [mlflow] and the `track` stage; `mlflow ui` needs full mlflow
]
export = [
    "protobuf>=7.36.2",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "tqdm>=4.70.1",
]

[project.scripts]
distillkit = "distillkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillkit"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # no .pytest_cache written into the checkout

# torch from the CUDA 12.9 index: Leonardo's Booster driver is CUDA 12.2, which can't run PyPI's
# default CUDA 13 wheel; a 12.9 build runs there (minor-version compatibility) and on newer drivers.
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
