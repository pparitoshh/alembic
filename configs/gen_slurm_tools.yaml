# Teacher data for the batch 1 gap: Slurm usage + tool traces from the trainable Slurm seeds in data/seeds
# (slurm_job_arrays / slurm_requeue_signals stay held out via seeds.eval_docs). See docs/TRAINING_PROGRESS.md.
# Leonardo template (GOAL.md §3): Qwen3-32B teacher on one A100 64 GB -> Qwen3-4B-Instruct-2507 student, QDoRA.
# Start the teacher first, e.g. on a compute node:
#   vllm serve Qwen/Qwen3-32B-AWQ --max-logprobs 20 --tool-call-parser hermes --enable-auto-tool-choice
# then point base_url at it (ssh tunnel or the node's hostname).
run_dir: runs/gen_slurm_tools_p12

seeds:
  dir: data/seeds
  eval_docs: [slurm_job_arrays, slurm_requeue_signals]   # held out BEFORE any generation
  chunk_chars: 1500

teacher:
  base_url: http://localhost:8000/v1   # vllm serve; no api_key_env for a local server
  model: Qwen/Qwen3-32B-AWQ            # or the GGUF Q4_K_M via llama-server (RESEARCH.md §2.2)
  temperature: 0.7
  max_tokens: 1024
  concurrency: 32                      # vLLM batches concurrent requests; tune from the day-1 throughput test
  top_logprobs: 20                     # saved to run_dir/teacher_logprobs.jsonl.gz for v2 logit KD
  extra_body:
    return_tokens_as_token_ids: true   # vLLM: tokens come back as "token_id:<n>"
    chat_template_kwargs: {enable_thinking: false}

# Judge: gpt-oss-20b (OpenAI, Apache 2.0, ~16 GB MXFP4), served on the cluster by slurm/evaluate.sbatch;
# base_url is set per job with --set. Cross-check judge: Gemma 4 26B-A4B IT (Google, Apache 2.0), same
# answers, run with `--set eval.tag=gemma4 --set judge.model=google/gemma-4-26B-A4B-it` (see slurm/README.md).
# Validate either judge first with the `calibrate` stage.
judge:
  base_url: http://127.0.0.1:8001/v1
  model: openai/gpt-oss-20b
  temperature: 0.0
  max_tokens: 4096          # reasons before the verdict; reasoning is returned separately by vLLM
  concurrency: 16
  extra_body:
    reasoning_effort: medium

generate:
  questions_per_chunk: 48   # gen_slurm_tools: capped at personas x task_types per chunk (12 x 4)
  answers_per_question: 1   # one shared GPU: spend extra samples on failure areas instead (GOAL.md §6)
  personas:
    - a new PhD student who has never used a cluster
    - a research software engineer porting code to GPUs
    - an ML engineer running multi-GPU training jobs
    - a sysadmin debugging stuck or failing jobs
    # gen_slurm_tools: 8 more personas so each chunk yields 48 questions instead of 16
    - a bioinformatician running many small pipeline jobs
    - a climate scientist running long MPI simulations
    - a chemist running licensed software on a shared cluster
    - a data scientist moving from a laptop to the cluster
    - a teaching assistant helping students submit their first jobs
    - a postdoc who needs results before a paper deadline
    - an engineer benchmarking code on different partitions
    - a user whose job keeps failing with out-of-memory errors
  task_types: [concept, howto, script, debug]
  tool_fraction: 0.5        # gen_slurm_tools: batch 1 had 3 tool traces in 4,775
  tool_mix: {call: 0.4, ask: 0.2, none: 0.4}   # gen_slurm_tools: batch 1 students over-call tools
  gold_dir: data/gold       # few-shot anchors: prose.json, tool_trace.json

verify:
  dedup_threshold: 0.8
  max_answer_chars: 4000

student:
  model: Qwen/Qwen3-4B-Instruct-2507   # non-thinking, better tool use (GOAL.md §3, RESEARCH.md §2.1)
  system_prompt: You are an HPC assistant. Answer questions about Slurm, CUDA, MPI and profiling concisely and correctly. Put scripts in fenced code blocks.

train:
  method: dora
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0   # DoRA's fast path
  learning_rate: 1.0e-4   # starting point: re-tune with a short sweep on day 1
  epochs: 3
  seed: 42
  batch_size: 4
  grad_accum: 4
  max_length: 2048   # tool-calling traces are longer than prose answers
  bf16: true
  save_steps: 100    # a job killed at the wall time resumes from the newest checkpoint on resubmission
  val_fraction: 0.05 # eval loss every save_steps on whole held-out source documents
  report_to: [mlflow]

eval:
  file: data/eval/eval_all_v2.jsonl
  tool_file: data/eval/eval_tools.jsonl   # tool-calling slice (draft; model review pending)
  calibration_file: data/eval/judge_calibration.jsonl   # known-label pairs for `calibrate`
  max_new_tokens: 512

export:
  llama_cpp: ~/tools/llama.cpp       # on Leonardo: a checkout in $WORK with the release binaries
  quants: [Q4_K_M, Q8_0, Q5_K_M, Q3_K_M]   # >= 3 levels for the Pareto frontier (G6)
  ollama_name: hpc-assistant
